[package]
name = "buzz-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "buzz-cli"
path = "src/main.rs"

[dependencies]
lazy_static = "1.4"
humantime = "2.4"
buzz-core = { path = "../buzz-core" }
qfz3 = { path = "../../qfz3/qfz3-engine" }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
crossterm = "0.27"
ratatui = "0.27"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1.44"
anyhow = "1.0.104"
serde_json = "1.0.151"
indicatif = "0.18.6"
colored = "3.1.1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5.2"
