[workspace]
members = ["buzz-core", "buzz-cli", "buzz-gateway"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zero Copies <dev@zerocopies.ai>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.27"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
lazy_static = "1.4"
regex = "1.10"
