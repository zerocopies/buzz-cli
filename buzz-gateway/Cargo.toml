[package]
name = "buzz-gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "buzz-gateway"
path = "src/main.rs"

[dependencies]
# --- HTTP server ---
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "timeout"] }

# --- Streaming ---
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Auth token ---
rand = "0.8"
subtle = "2"          # constant-time token comparison

# --- Errors / logging ---
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Time / IDs ---
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# --- Local integration ---
buzz-core = { path = "../buzz-core" }
buzz-cli = { path = "../buzz-cli" }
