name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release package
        run: bash buzz-gateway/dist/package.sh

      - name: Find staged tarball
        id: find_artifact
        run: |
          ARTIFACT=$(find target/package -name 'buzz-gateway-*.tar.gz' | head -n1)
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_artifact.outputs.path }}
          generate_release_notes: true
